apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-subscriber
  namespace: home-iot
  labels:
    app: home-subscriber
    app.kubernetes.io/name: home-subscriber
    app.kubernetes.io/part-of: home-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-subscriber
  template:
    metadata:
      labels:
        app: home-subscriber
        app.kubernetes.io/name: home-subscriber
        app.kubernetes.io/part-of: home-iot
    spec:
      containers:
      - name: subscriber
        image: home-subscriber:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: home-iot-secrets
              key: DATABASE_URL
        - name: MQTT_BROKER
          valueFrom:
            configMapKeyRef:
              name: home-iot-config
              key: MQTT_BROKER
        - name: MQTT_PORT
          valueFrom:
            configMapKeyRef:
              name: home-iot-config
              key: MQTT_PORT
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: home-iot-secrets
              key: MQTT_USERNAME
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: home-iot-secrets
              key: MQTT_PASSWORD
        - name: INSTALLATION_PREFIX
          valueFrom:
            configMapKeyRef:
              name: home-iot-config
              key: INSTALLATION_PREFIX
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - "python.*subscriber"
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - pgrep
            - -f
            - "python.*subscriber"
          initialDelaySeconds: 5
          periodSeconds: 10
